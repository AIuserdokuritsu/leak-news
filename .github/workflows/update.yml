name: update-news

on:
  schedule:
    - cron: "0 23 * * *"   # 毎日 日本時間の朝8:00 (UTCの23:00)
  workflow_dispatch:        # 手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
      - name: Commit data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "update news"
          git push
